<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>標準作業割当マスター</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f8; margin: 0; padding: 12px; color: #333; }
    h1 { text-align: center; font-size: 1.2rem; color: #1e3c72; margin: 8px 0 12px; }
    
    .card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
    .label { font-size: 0.8rem; font-weight: bold; color: #666; margin-bottom: 4px; display: block; }
    
    .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .control-group { flex: 1; min-width: 100px; }
    select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; background: #fff; font-size: 0.9rem; font-weight: bold; color: #1e3c72; }

    .mode-tab { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #cbd5e1; font-weight: bold; border-radius: 8px; cursor: pointer; color: #475569; font-size: 0.9rem; }
    .tab-btn.active { background: #1e3c72; color: #fff; }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: left; }
    th, td { border: 1px solid #e2e8f0; padding: 6px 4px; vertical-align: top; }
    th { background: #1e3c72; color: #fff; text-align: center; white-space: nowrap; }
    .bg-core { background-color: #fef3c7; font-weight: bold; color: #b45309; }
    .pos-badge { background: #e2e8f0; padding: 2px 4px; border-radius: 4px; font-weight: bold; text-align: center; display: block; }

    .game-box { text-align: center; }
    .question-card { background: #e0f2fe; border: 2px solid #0284c7; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .q-pos { font-size: 1.2rem; font-weight: bold; color: #0369a1; }
    .q-type { font-size: 0.85rem; color: #334155; margin-top: 4px; }
    
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
    .opt-btn { padding: 10px; border: 2px solid #cbd5e1; background: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: left; font-size: 0.85rem; }

    .result-msg { font-weight: bold; margin: 8px 0; padding: 8px; border-radius: 6px; display: none; font-size: 0.9rem; }
    .result-msg.correct { background: #dcfce7; color: #15803d; }
    .result-msg.wrong { background: #fee2e2; color: #b91c1c; }

    .next-btn { background: #22c55e; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; display: none; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="card controls">

      <label class="label">タイプ選択</label>
      <select id="typeSelect" onchange="updateView()">
        <option value="A">タイプA (SLR-F)</option>
        <option value="B" selected>タイプB (SLR-C)</option>
      </select>
    </div>
    <div class="control-group">
      <label class="label">稼働人数</label>
      <select id="countSelect" onchange="updateView()">
        <option value="2">2名稼働</option>
        <option value="3">3名稼働</option>
        <option value="4">4名稼働</option>
        <option value="5">5名稼働</option>

        <option value="10" selected>10名稼働</option>
        <option value="11">11名稼働</option>
      </select>
    </div>
    <div class="control-group" id="posFilterGroup" style="display:none;">
      <label class="label">対象ポジション</label>
      <select id="posSelect" onchange="filterQuizByPos()">
        <option value="ALL">全ポジション (ランダム)</option>
      </select>
    </div>
  </div>

  <div class="mode-tab">
    <button id="btnList" class="tab-btn active" onclick="switchTab('list')">📋 一覧表で確認</button>
    <button id="btnGame" class="tab-btn" onclick="switchTab('game')">🎮 ゲーム挑戦</button>
  </div>

  <div id="listView" class="card table-container">
    <table>
      <thead>
        <tr>
          <th style="width:10%;">POS</th>
          <th style="width:30%;">コア作業</th>
          <th style="width:30%;">メイン作業</th>
          <th style="width:30%;">フォロー作業</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

    <div id="options" class="options-grid"></div>
    <div id="resultMsg" class="result-msg"></div>

          { pos: "FT", core: "サービング\nミドルクリーンアップ\nファイナルクリーンアップ", main: "①ラウンド・お困り対応", follow: "①セットアップ" },
          { pos: "C", core: null, sameCoreAs: "FT", main: "①キャッシャー", follow: "①ドリンク" },
          { pos: "D", core: null, sameCoreAs: "FT", main: "①ベリフィケーション\n②ドリンク", follow: "①キャッシャー" },
          { pos: "KT", core: null, sameCoreAs: "FT", main: "①サービング\n②サラダ・冷前菜", follow: "①ディッシュウォッシュ" },
          { pos: "H", core: "クックアウト・デコレーション", main: "①サラダ・冷前菜\n②ヒート", follow: "①サービング\n②ディッシュウォッシュ" },
          { pos: "K", core: null, sameCoreAs: "H", main: "①クックイン", follow: "" }
        ],
        9: [
          { pos: "W", core: "ミドルクリーンアップ", main: "①ウェルカム・ナビ", follow: "①セットアップ" },
          { pos: "S", core: "ファイナルクリーンアップ", main: "①セットアップ\n②ナビゲーション", follow: "①オーダーテイキング\n②サービング" },
          { pos: "FT", core: "サービング", main: "①ラウンド・お困り対応", follow: "①オーダーテイキング\n②セットアップ" },
          { pos: "C", core: null, sameCoreAs: "FT", main: "①キャッシャー", follow: "①ドリンク" },
          { pos: "D", core: "ファイナルクリーンアップ\nミドルクリーンアップ", main: "①ベリフィケーション\n②ドリンク", follow: "" },
          { pos: "DW", core: "クックアウト・デコレーション", main: "①ディッシュウォッシュ", follow: "①サラダ・冷前菜\n②ドリンク" },
          { pos: "KT", core: null, sameCoreAs: "DW", main: "①サラダ・冷前菜", follow: "①ヒート\n②サービング" },
          { pos: "H", core: null, sameCoreAs: "DW", main: "①ヒート", follow: "" },
          { pos: "K", core: null, sameCoreAs: "DW", main: "①クックイン", follow: "" }
        ],
        10: [
          { pos: "W", core: "ファイナルクリーンアップ\nミドルクリーンアップ", main: "①ウェルカム・ナビ\n②セットアップ", follow: "①ナビゲーション\n②サービング" },
          { pos: "S", core: null, sameCoreAs: "W", main: "①セットアップ", follow: "①オーダーテイキング" },
          { pos: "FT", core: "ファイナルクリーンアップ\nミドルクリーンアップ\nサービング", main: "①ラウンド・お困り対応", follow: "①オーダーテイキング\n②セットアップ" },
          { pos: "C", core: null, sameCoreAs: "FT", main: "①キャッシャー\n②ドリンク", follow: "①DBラウンド\n②キャッシャー" },
          { pos: "D", core: "ファイナルクリーンアップ\nサービング", main: "①ベリフィケーション", follow: "①ドリンク" },
          { pos: "V", core: null, sameCoreAs: "D", main: "①ベリフィケーション", follow: "①ドリンク\n②サラダ・冷前菜" },
          { pos: "DW", core: "クックアウト・デコレーション", main: "①ディッシュウォッシュ", follow: "①サラダ・冷前菜" },
          { pos: "KT", core: null, sameCoreAs: "DW", main: "①サラダ・冷前菜", follow: "①ヒート\n②Kスタンバイ" },
          { pos: "H", core: null, sameCoreAs: "DW", main: "①ヒート", follow: "①Kスタンバイ" },
          { pos: "K", core: null, sameCoreAs: "DW", main: "①クックイン", follow: "" }
        ],
        11: [
          { pos: "W", core: "ミドルクリーンアップ\nファイナルクリーンアップ", main: "①ウェルカム・ナビ", follow: "①セットアップ\n②オーダーテイキング" },
          { pos: "S", core: "サービング", main: "①セットアップ\n②ナビゲーション", follow: "①サービング" },
          { pos: "FT", core: "ミドルクリーンアップ\nファイナルクリーンアップ", main: "①ラウンド・お困り対応", follow: "①セットアップ\n②DBラウンド" },
          { pos: "C", core: "サービング", main: "①キャッシャー", follow: "①DBラウンド" },
          { pos: "D", core: "ファイナルクリーンアップ", main: "①ベリフィケーション", follow: "①ドリンク" },
          { pos: "V", core: "サービング", main: "①ベリフィケーション", follow: "①ドリンク" },
          { pos: "DW", core: "デコレーション", main: "①ディッシュウォッシュ", follow: "①サラダ・冷前菜" },
          { pos: "KT", core: null, sameCoreAs: "DW", main: "①サラダ・冷前菜", follow: "①ヒート" },
          { pos: "H", core: null, sameCoreAs: "DW", main: "①ヒート", follow: "①Kスタンバイ" },
          { pos: "KO", core: "サービング", main: "①クックアウト", follow: "①クックイン" },
          { pos: "KI", core: "デコレーション", main: "①クックイン", follow: "①クックアウト" }
        ]
      }
    };

    let allQuestionsForCurrentSetting = [];
    let currentQuestions = [];
    let currentQIndex = 0;

    function formatText(val) {
      if (!val || val === "") return "-";
      return val.replace(/\n/g, '<br>');
    }

    function updateView() {
      const type = document.getElementById("typeSelect").value;
      const count = document.getElementById("countSelect").value;
      
      const typeData = dataStore[type] || {};
      const data = typeData[count] || [];

      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      
      if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>データがありません</td></tr>";
      } else {
        let i = 0;
        while (i < data.length) {
          const item = data[i];
          const row = document.createElement("tr");

          let coreTdHtml = "";
          if (item.core !== null) {
            let spanCount = 1;
            for (let j = i + 1; j < data.length; j++) {
              if (data[j].core === null && data[j].sameCoreAs === item.pos) {
                spanCount++;
              } else {
                break;
              }
            }
            const coreText = formatText(item.core);
            coreTdHtml = `<td class="bg-core" rowspan="${spanCount}">${coreText}</td>`;
          }

          row.innerHTML = `
            <td><span class="pos-badge">${item.pos}</span></td>
            ${coreTdHtml}
            <td>${formatText(item.main)}</td>
            <td>${formatText(item.follow)}</td>
          `;
          tbody.appendChild(row);
          i++;
        }
      }

      updatePosSelector(data);
      generateMasterQuizData(data);
    }

    function updatePosSelector(data) {
      const posSelect = document.getElementById("posSelect");
      const currentSelected = posSelect.value;
      posSelect.innerHTML = '<option value="ALL">全ポジション (ランダム)</option>';

      if (data && data.length > 0) {
        data.forEach(item => {
          const opt = document.createElement("option");
          opt.value = item.pos;
          opt.textContent = `POS: ${item.pos}`;
          posSelect.appendChild(opt);
        });
      }

      // 前回の選択値が維持可能なら維持
      if (Array.from(posSelect.options).some(o => o.value === currentSelected)) {
        posSelect.value = currentSelected;
      } else {
        posSelect.value = "ALL";
      }
    }

    function getEffectiveCore(item, dataList) {
      if (item.core !== null) return item.core;
      if (item.sameCoreAs) {
        const parent = dataList.find(x => x.pos === item.sameCoreAs);
        return parent ? parent.core : "";
      }
      return "";
    }

    function generateMasterQuizData(data) {
      allQuestionsForCurrentSetting = [];
      if (data && data.length > 0) {
        data.forEach(item => {
          const effCore = getEffectiveCore(item, data);
          if(effCore && effCore !== "") allQuestionsForCurrentSetting.push({ pos: item.pos, typeName: "コア作業", answer: effCore });
          if(item.main && item.main !== "") allQuestionsForCurrentSetting.push({ pos: item.pos, typeName: "メイン作業", answer: item.main });
          if(item.follow && item.follow !== "") allQuestionsForCurrentSetting.push({ pos: item.pos, typeName: "フォロー作業", answer: item.follow });
        });
      }

      filterQuizByPos();
    }

    function filterQuizByPos() {
      const selectedPos = document.getElementById("posSelect").value;
      
      if (selectedPos === "ALL") {
        currentQuestions = [...allQuestionsForCurrentSetting];
      } else {
        currentQuestions = allQuestionsForCurrentSetting.filter(q => q.pos === selectedPos);
      }

      currentQuestions.sort(() => Math.random() - 0.5);
      currentQIndex = 0;
      showQuestion();
    }

    function showQuestion() {
      const resultMsg = document.getElementById("resultMsg");
      const nextBtn = document.getElementById("nextBtn");
      const optionsContainer = document.getElementById("options");

      resultMsg.style.display = "none";
      nextBtn.style.display = "none";

      if(currentQuestions.length === 0) {
        document.getElementById("qPos").innerText = "問題データがありません";
        document.getElementById("qType").innerText = "";
        optionsContainer.innerHTML = "";
        return;
      }

      if(currentQIndex >= currentQuestions.length) currentQIndex = 0;

      const q = currentQuestions[currentQIndex];
      const typeStr = document.getElementById("typeSelect").value;
      const countStr = document.getElementById("countSelect").value;

      document.getElementById("qPos").innerText = `POS: ${q.pos} （タイプ${typeStr} / ${countStr}名稼働）`;
      document.getElementById("qType").innerText = `「${q.typeName}」として正しいものを選択してください`;

      optionsContainer.innerHTML = "";

      const allAnswers = Array.from(new Set(
        Object.values(dataStore).flatMap(t => 
          Object.values(t).flatMap(cList => 
            cList.flatMap(i => [getEffectiveCore(i, cList), i.main, i.follow])
          )
        )
      )).filter(a => a && a !== "" && a !== q.answer);

      allAnswers.sort(() => Math.random() - 0.5);

      const choices = [q.answer, ...allAnswers.slice(0, 3)];
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerHTML = opt.replace(/\n/g, '<br>');
        btn.onclick = () => checkAnswer(opt, q.answer);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct) {
      const resultMsg = document.getElementById("resultMsg");
      const nextBtn = document.getElementById("nextBtn");
      const btns = document.querySelectorAll(".opt-btn");
      
      btns.forEach(b => b.disabled = true);

      if(selected === correct) {
        resultMsg.innerText = "⭕ 正解！素晴らしい判断力です！";
        resultMsg.className = "result-msg correct";
      } else {
        resultMsg.innerText = `❌ 不正解... 正解は:\n${correct}`;
        resultMsg.className = "result-msg wrong";
      }

      resultMsg.style.display = "block";
      nextBtn.style.display = "block";
    }

    function nextQuestion() {
      currentQIndex++;
      showQuestion();
    }

    function switchTab(tab) {
      const posFilterGroup = document.getElementById('posFilterGroup');
      if(tab === 'list') {
        document.getElementById('listView').style.display = 'block';
        document.getElementById('gameView').style.display = 'none';
        document.getElementById('btnList').classList.add('active');
        document.getElementById('btnGame').classList.remove('active');
        posFilterGroup.style.display = 'none';
      } else {
        document.getElementById('listView').style.display = 'none';
        document.getElementById('gameView').style.display = 'block';
        document.getElementById('btnList').classList.remove('active');
        document.getElementById('btnGame').classList.add('active');
        posFilterGroup.style.display = 'block';
      }
    }

    window.addEventListener('DOMContentLoaded', updateView);
  </script>
