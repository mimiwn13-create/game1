      const tbody = document.getElementById("tableBody");      tbody.innerHTML = "";            if (data.length === 0) {        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>データがありません</td></tr>";      } else {        data.forEach(item => {          // コア作業が "-" や未定義の場合に自動補完          let coreVal = item.core;          if (!coreVal || coreVal === "-") {            coreVal = defaultCoreMap[item.pos] || "標準コア作業";          }
          const row = document.createElement("tr");          row.innerHTML = `            <td><span class="pos-badge">${item.pos}</span></td>            <td class="bg-core">${coreVal.replace(/\n/g, '<br>')}</td>            <td>${item.main ? item.main.replace(/\n/g, '<br>') : '-'}</td>            <td>${item.follow ? item.follow.replace(/\n/g, '<br>') : '-'}</td>          `;          tbody.appendChild(row);        });      }
      generateQuizData(type, count, data);    }
    function generateQuizData(type, count, data) {      currentQuestions = [];      if (data && data.length > 0) {        data.forEach(item => {          let coreVal = item.core;          if (!coreVal || coreVal === "-") {            coreVal = defaultCoreMap[item.pos] || "標準コア作業";          }          currentQuestions.push({ pos: item.pos, typeName: "コア作業", answer: coreVal });
          if(item.main && item.main !== "-") currentQuestions.push({ pos: item.pos, typeName: "メイン作業", answer: item.main });          if(item.follow && item.follow !== "-") currentQuestions.push({ pos: item.pos, typeName: "フォロー作業", answer: item.follow });        });      }
      currentQuestions.sort(() => Math.random() - 0.5);      currentQIndex = 0;      showQuestion();    }
    function showQuestion() {      const resultMsg = document.getElementById("resultMsg");      const nextBtn = document.getElementById("nextBtn");      const optionsContainer = document.getElementById("options");
      resultMsg.style.display = "none";      nextBtn.style.display = "none";
      if(currentQuestions.length === 0) {        document.getElementById("qPos").innerText = "問題データがありません";        document.getElementById("qType").innerText = "";        optionsContainer.innerHTML = "";        return;      }
      if(currentQIndex >= currentQuestions.length) currentQIndex = 0;
      const q = currentQuestions[currentQIndex];      const typeStr = document.getElementById("typeSelect").value;      const countStr = document.getElementById("countSelect").value;
      document.getElementById("qPos").innerText = `POS: ${q.pos} （タイプ${typeStr} / ${countStr}名稼働）`;      document.getElementById("qType").innerText = `「${q.typeName}」として正しいものを選択してください`;
      optionsContainer.innerHTML = "";
      const allAnswers = Array.from(new Set(        Object.values(dataStore).flatMap(t =>           Object.values(t).flatMap(c =>             c.flatMap(i => [i.core, i.main, i.follow])          )        )      )).filter(a => a && a !== "-" && a !== q.answer);
      allAnswers.sort(() => Math.random() - 0.5);
      const choices = [q.answer, ...allAnswers.slice(0, 3)];      choices.sort(() => Math.random() - 0.5);
      choices.forEach(opt => {        const btn = document.createElement("button");        btn.className = "opt-btn";        btn.innerText = opt;        btn.onclick = () => checkAnswer(opt, q.answer);        optionsContainer.appendChild(btn);      });    }
    function checkAnswer(selected, correct) {      const resultMsg = document.getElementById("resultMsg");      const nextBtn = document.getElementById("nextBtn");      const btns = document.querySelectorAll(".opt-btn");            btns.forEach(b => b.disabled = true);
      if(selected === correct) {        resultMsg.innerText = " 正解！素晴らしい判断力です！";        resultMsg.className = "result-msg correct";      } else {        resultMsg.innerText = ` 不正解... 正解は:\n${correct}`;        resultMsg.className = "result-msg wrong";      }
      resultMsg.style.display = "block";      nextBtn.style.display = "block";    }
    function nextQuestion() {      currentQIndex++;      showQuestion();    }
